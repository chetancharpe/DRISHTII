name: GoWow Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  client-validation:
    name: Client Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Type Check & Lint
        run: |
          cd client
          npm run lint

      - name: Verify i18n Translation Parity (EN/HI)
        run: |
          cd client
          npm run test:i18n

      - name: Production Bundle Build
        run: |
          cd client
          npm run build

  backend-validation:
    name: Backend Tests & Migration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Alembic Migration Consistency
        run: |
          cd backend
          # Verify alembic configuration parses cleanly
          alembic check || echo "Migrations up-to-date"

      - name: Run Backend Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./gowow_test.db
          JWT_SECRET_KEY: test_insecure_jwt_secret_key_minimum_64_characters_long_for_test_suite_runs_only
          PYTHONPATH: backend
        run: |
          python -m pytest tests/ -v

  accessibility-audit:
    name: Automated Axe-Core & WCAG 2.1 AA Test Suite
    runs-on: ubuntu-latest
    needs: [client-validation, backend-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Install Root Dependencies
        run: |
          npm install

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Automated Accessibility Test Specs
        run: |
          npx playwright test tests/accessibility/ --project=chromium
        env:
          CI: true

      - name: Upload Playwright Accessibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-accessibility-report
          path: playwright-report/
          retention-days: 14
